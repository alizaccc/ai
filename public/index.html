<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Puter Free AI Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Puter SDK -->
  <script src="https://cdn.puter.com/puter.min.js"></script>

  <!-- Markdown & Highlight -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/common.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Puter AI Chat</h1>

      <select id="model">
        <option value="claude-3-sonnet">Claude 3 Sonnet</option>
        <option value="gpt-5.4-nano">GPT‑5.4 Nano</option>
        <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash</option>
      </select>
    </header>

    <main id="chat"></main>

    <footer>
      <input id="input" placeholder="输入消息…" />
      <button id="send">发送</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
